<h1>Diagnóstico de custos</h1>
<p>Registra a estrutura das operações do CPlug. Não altera produtos nem envia o relatório automaticamente.</p>
<p id="status">Carregando…</p>
<button id="export">Exportar diagnóstico</button><button id="clear">Limpar diagnóstico</button>
<p>Após instalar, recarregue o CPlug. Os valores dos campos e os cabeçalhos de autenticação não são gravados.</p>
